<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Set Counter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f0f;
    color: #fff;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    -webkit-user-select: none;
    user-select: none;
  }

  header {
    text-align: center;
    padding: 20px 16px 12px;
    border-bottom: 1px solid #222;
  }
  header h1 { font-size: 20px; font-weight: 600; color: #ccc; }

  .exercise-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid #222;
  }
  .exercise-bar::-webkit-scrollbar { display: none; }

  .exercise-tab {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #888;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .exercise-tab.active {
    background: #ff6b35;
    border-color: #ff6b35;
    color: #fff;
    font-weight: 600;
  }
  .exercise-tab.add-btn {
    border-style: dashed;
    color: #555;
    font-size: 18px;
    padding: 8px 14px;
  }

  .counter-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 8px;
  }
  .exercise-nav {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .nav-btn {
    border: 1px solid #333;
    background: #1a1a1a;
    color: #999;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    letter-spacing: 0.3px;
    cursor: pointer;
  }

  .exercise-name {
    font-size: 22px;
    font-weight: 700;
    color: #ff6b35;
    margin-bottom: 4px;
  }
  .exercise-detail {
    font-size: 14px;
    color: #666;
    margin-bottom: 20px;
  }

  .set-count {
    font-size: 140px;
    font-weight: 800;
    line-height: 1;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .set-label {
    font-size: 18px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }
  .target-label {
    font-size: 15px;
    color: #444;
    margin-bottom: 24px;
  }
  .target-label .done { color: #4ecdc4; }

  .dots {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 280px;
  }
  .dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #222;
    border: 2px solid #333;
    transition: all 0.3s;
  }
  .dot.filled {
    background: #ff6b35;
    border-color: #ff6b35;
    box-shadow: 0 0 8px rgba(255,107,53,0.4);
  }

  .buttons {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .btn {
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.92); }

  .btn-add {
    width: 90px; height: 90px;
    background: #ff6b35;
    color: #fff;
    font-size: 42px;
    font-weight: 300;
    box-shadow: 0 4px 20px rgba(255,107,53,0.4);
  }
  .btn-sub {
    width: 56px; height: 56px;
    background: #1a1a1a;
    border: 2px solid #333;
    color: #888;
    font-size: 28px;
  }
  .btn-reset {
    width: 56px; height: 56px;
    background: #1a1a1a;
    border: 2px solid #333;
    color: #888;
    font-size: 16px;
  }

  .footer-bar {
    display: flex;
    justify-content: space-around;
    padding: 12px 16px 24px;
    border-top: 1px solid #222;
  }
  .footer-btn {
    background: none;
    border: none;
    color: #555;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .footer-btn svg { width: 22px; height: 22px; fill: #555; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #1a1a1a;
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 340px;
  }
  .modal h2 { font-size: 18px; margin-bottom: 16px; color: #ddd; }
  .modal label { display: block; font-size: 13px; color: #888; margin-bottom: 4px; }
  .modal input, .modal select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0f0f0f;
    color: #fff;
    font-size: 16px;
    margin-bottom: 12px;
    outline: none;
  }
  .modal input:focus { border-color: #ff6b35; }
  .modal-buttons { display: flex; gap: 10px; margin-top: 8px; }
  .modal-buttons button {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .modal-buttons .cancel { background: #222; color: #888; }
  .modal-buttons .save { background: #ff6b35; color: #fff; }
  .modal-buttons .delete { background: #c0392b; color: #fff; }

  @media (max-height: 600px) {
    .set-count { font-size: 100px; }
    .counter-area { gap: 4px; padding: 10px; }
  }
</style>
</head>
<body>

<header><h1>Set Counter</h1></header>

<div class="exercise-bar" id="exerciseBar"></div>

<div class="counter-area">
  <div class="exercise-nav">
    <button class="nav-btn" onclick="prevExercise()" title="Previous exercise">← Prev</button>
    <button class="nav-btn" onclick="nextExercise()" title="Next exercise">Next →</button>
  </div>
  <div class="exercise-name" id="exName"></div>
  <div class="exercise-detail" id="exDetail"></div>
  <div class="set-label">Sets Done</div>
  <div class="set-count" id="setCount">0</div>
  <div class="target-label" id="targetLabel"></div>
  <div class="dots" id="dots"></div>
  <div class="buttons">
    <button class="btn btn-sub" onclick="decrement()" title="Undo">-</button>
    <button class="btn btn-add" onclick="increment()" title="Add set">+</button>
    <button class="btn btn-reset" onclick="resetCurrent()" title="Reset">0</button>
  </div>
</div>

<div class="footer-bar">
  <button class="footer-btn" onclick="resetAll()">
    <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    Reset All
  </button>
  <button class="footer-btn" onclick="openModal()">
    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    Edit
  </button>
</div>

<!-- Add / Edit Exercise Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">Add Exercise</h2>
    <label>Exercise Name</label>
    <input type="text" id="inputName" list="exerciseSuggestions" placeholder="e.g. Leg Extension" autocomplete="off">
    <datalist id="exerciseSuggestions">
      <option value="Seated Squat Machine"></option>
      <option value="Leg Press"></option>
      <option value="Leg Extension"></option>
      <option value="Seated Leg Curl"></option>
      <option value="Hip Adduction Machine"></option>
      <option value="Hip Abduction Machine"></option>
      <option value="Abdominal Crunch Machine"></option>
      <option value="Chest Press Machine"></option>
      <option value="Pec Deck / Chest Fly"></option>
      <option value="Lat Pulldown"></option>
      <option value="Seated Cable Row"></option>
      <option value="Shoulder Press Machine"></option>
      <option value="Triceps Pushdown (Cable)"></option>
      <option value="Biceps Curl Machine"></option>
      <option value="Glute Kickback Machine"></option>
      <option value="Calf Raise Machine"></option>
    </datalist>
    <label>Target Sets</label>
    <input type="number" id="inputSets" placeholder="e.g. 4" min="1" max="20" inputmode="numeric">
    <label>Weight / Reps (optional)</label>
    <input type="text" id="inputDetail" placeholder="e.g. 60kg x 8" autocomplete="off">
    <div class="modal-buttons">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="delete" id="deleteBtn" onclick="deleteExercise()" style="display:none">Delete</button>
      <button class="save" onclick="saveExercise()">Save</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'gym-set-counter';

let exercises = [];
let activeIdx = 0;
let editMode = false;

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (d && d.exercises && d.exercises.length) {
      exercises = d.exercises;
      activeIdx = Math.min(d.activeIdx || 0, exercises.length - 1);
      return;
    }
  } catch {}
  exercises = [
    { name: 'Seated Squat Machine', target: 4, detail: 'Warm-up + working sets', count: 0 },
    { name: 'Leg Extension', target: 3, detail: '', count: 0 },
    { name: 'Seated Leg Curl', target: 3, detail: '', count: 0 },
    { name: 'Hip Adduction Machine', target: 3, detail: '', count: 0 },
    { name: 'Hip Abduction Machine', target: 3, detail: '', count: 0 },
    { name: 'Abdominal Crunch Machine', target: 3, detail: '', count: 0 },
    { name: 'Chest Press Machine', target: 3, detail: '', count: 0 },
    { name: 'Lat Pulldown', target: 3, detail: '', count: 0 },
    { name: 'Seated Cable Row', target: 3, detail: '', count: 0 },
    { name: 'Shoulder Press Machine', target: 3, detail: '', count: 0 },
  ];
  activeIdx = 0;
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ exercises, activeIdx }));
}

function render() {
  const bar = document.getElementById('exerciseBar');
  bar.innerHTML = '';
  exercises.forEach((ex, i) => {
    const tab = document.createElement('button');
    tab.className = 'exercise-tab' + (i === activeIdx ? ' active' : '');
    tab.textContent = ex.name;
    if (ex.count >= ex.target && ex.target > 0) tab.textContent += ' \u2713';
    tab.onclick = () => { activeIdx = i; save(); render(); };
    bar.appendChild(tab);
  });
  const addTab = document.createElement('button');
  addTab.className = 'exercise-tab add-btn';
  addTab.textContent = '+';
  addTab.onclick = () => openModal(true);
  bar.appendChild(addTab);

  const ex = exercises[activeIdx];
  document.getElementById('exName').textContent = ex.name;
  document.getElementById('exDetail').textContent = ex.detail || '';
  document.getElementById('setCount').textContent = ex.count;

  const targetEl = document.getElementById('targetLabel');
  if (ex.count >= ex.target && ex.target > 0) {
    targetEl.innerHTML = '<span class="done">Target reached!</span> (' + ex.target + ' sets)';
  } else {
    targetEl.textContent = 'Target: ' + ex.target + ' sets';
  }

  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  for (let i = 0; i < ex.target; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < ex.count ? ' filled' : '');
    dotsEl.appendChild(d);
  }
}

function increment() {
  exercises[activeIdx].count++;
  save(); render();
  if (navigator.vibrate) navigator.vibrate(30);
}

function nextExercise() {
  activeIdx = (activeIdx + 1) % exercises.length;
  save();
  render();
}

function prevExercise() {
  activeIdx = (activeIdx - 1 + exercises.length) % exercises.length;
  save();
  render();
}

function decrement() {
  if (exercises[activeIdx].count > 0) {
    exercises[activeIdx].count--;
    save(); render();
  }
}

function resetCurrent() {
  exercises[activeIdx].count = 0;
  save(); render();
}

function resetAll() {
  exercises.forEach(ex => ex.count = 0);
  save(); render();
}

function openModal(isNew) {
  editMode = !isNew;
  document.getElementById('modalTitle').textContent = isNew ? 'Add Exercise' : 'Edit Exercise';
  document.getElementById('deleteBtn').style.display = isNew ? 'none' : '';
  const ex = isNew ? { name: '', target: 4, detail: '' } : exercises[activeIdx];
  document.getElementById('inputName').value = ex.name;
  document.getElementById('inputSets').value = ex.target;
  document.getElementById('inputDetail').value = ex.detail || '';
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('inputName').focus(), 100);
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function saveExercise() {
  const name = document.getElementById('inputName').value.trim();
  const target = parseInt(document.getElementById('inputSets').value) || 4;
  const detail = document.getElementById('inputDetail').value.trim();
  if (!name) return;
  if (editMode) {
    exercises[activeIdx].name = name;
    exercises[activeIdx].target = target;
    exercises[activeIdx].detail = detail;
  } else {
    exercises.push({ name, target, detail, count: 0 });
    activeIdx = exercises.length - 1;
  }
  save(); render(); closeModal();
}

function deleteExercise() {
  if (exercises.length <= 1) return;
  exercises.splice(activeIdx, 1);
  activeIdx = Math.min(activeIdx, exercises.length - 1);
  save(); render(); closeModal();
}

load();
render();
</script>
</body>
</html>
